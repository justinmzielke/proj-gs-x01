<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splat Test</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #222; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #status { position: fixed; top: 10px; left: 10px; color: #fff; font-family: monospace; font-size: 13px; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">Loading splat...</div>
    <canvas id="c"></canvas>
    <script>
        // Minimal .splat viewer - antimatter15 style
        const canvas = document.getElementById('c');
        const status = document.getElementById('status');
        const gl = canvas.getContext('webgl2');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        });

        // Camera state
        let camTheta = 0.7;
        let camPhi = 0.3;
        let camDist = 3.5;
        let camTarget = [0, 0, 0];
        let dragging = false;
        let lastX, lastY;

        canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
        canvas.addEventListener('mouseup', () => dragging = false);
        canvas.addEventListener('mouseleave', () => dragging = false);
        canvas.addEventListener('mousemove', e => {
            if (!dragging) return;
            camTheta -= (e.clientX - lastX) * 0.005;
            camPhi = Math.max(-1.5, Math.min(1.5, camPhi + (e.clientY - lastY) * 0.005));
            lastX = e.clientX; lastY = e.clientY;
        });
        canvas.addEventListener('wheel', e => {
            camDist *= e.deltaY > 0 ? 1.1 : 0.9;
            camDist = Math.max(0.5, Math.min(20, camDist));
            e.preventDefault();
        }, { passive: false });

        const vsrc = `#version 300 es
        precision highp float;
        uniform mat4 proj, view;
        uniform vec2 viewport;
        in vec3 pos;
        in vec4 col;
        in vec3 covA;
        in vec3 covB;
        out vec4 vCol;
        out vec2 vUV;
        void main() {
            vec4 cam = view * vec4(pos, 1.0);
            vec4 p = proj * cam;
            float W = p.w;
            vec2 ndc = p.xy / W;

            float focal = proj[0][0] * viewport.x * 0.5;

            float z2 = cam.z * cam.z;
            mat3 J = mat3(
                focal / cam.z, 0.0, -(focal * cam.x) / z2,
                0.0, focal / cam.z, -(focal * cam.y) / z2,
                0.0, 0.0, 0.0
            );
            mat3 V = mat3(view);
            mat3 S = mat3(
                covA.x, covA.y, covA.z,
                covA.y, covB.x, covB.y,
                covA.z, covB.y, covB.z
            );
            mat3 cov2d = J * V * S * transpose(V) * transpose(J);
            float a = cov2d[0][0] + 0.3;
            float b = cov2d[0][1];
            float d = cov2d[1][1] + 0.3;

            float disc = sqrt(max((a-d)*(a-d) + 4.0*b*b, 0.0));
            float l1 = max((a+d+disc)*0.5, 0.1);
            float l2 = max((a+d-disc)*0.5, 0.1);
            float r = ceil(3.0 * sqrt(max(l1, l2)));

            if (cam.z > 0.0 || r < 1.0) { gl_Position = vec4(0,0,2,1); return; }

            vec2 quad = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1)) * 2.0 - 1.0;
            vUV = quad * r;
            vCol = col;
            gl_Position = vec4(ndc + quad * vec2(r, r) / viewport, p.z/W, 1.0);
        }`;

        const fsrc = `#version 300 es
        precision highp float;
        in vec4 vCol;
        in vec2 vUV;
        out vec4 frag;
        void main() {
            float d2 = dot(vUV, vUV);
            if (d2 > 9.0) discard;
            float alpha = exp(-0.5 * d2) * vCol.a;
            frag = vec4(vCol.rgb * alpha, alpha);
        }`;

        function compile(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
            return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const u_proj = gl.getUniformLocation(prog, 'proj');
        const u_view = gl.getUniformLocation(prog, 'view');
        const u_viewport = gl.getUniformLocation(prog, 'viewport');

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.DEPTH_TEST);

        let splatCount = 0;
        let positions, colors, covAs, covBs;
        let posBuf, colBuf, covABuf, covBBuf;
        let sortedPos, sortedCol, sortedCovA, sortedCovB;

        function perspective(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const nf = 1 / (near - far);
            return new Float32Array([
                f/aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far+near)*nf, -1,
                0, 0, 2*far*near*nf, 0
            ]);
        }

        function lookAt(eye, target, up) {
            const zx = eye[0]-target[0], zy = eye[1]-target[1], zz = eye[2]-target[2];
            const zl = Math.sqrt(zx*zx+zy*zy+zz*zz);
            const z = [zx/zl, zy/zl, zz/zl];
            const xx = up[1]*z[2]-up[2]*z[1], xy = up[2]*z[0]-up[0]*z[2], xz = up[0]*z[1]-up[1]*z[0];
            const xl = Math.sqrt(xx*xx+xy*xy+xz*xz);
            const x = [xx/xl, xy/xl, xz/xl];
            const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
            return new Float32Array([
                x[0], y[0], z[0], 0,
                x[1], y[1], z[1], 0,
                x[2], y[2], z[2], 0,
                -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
                -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
                -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1
            ]);
        }

        function sortSplats(eyeX, eyeY, eyeZ) {
            const depths = new Float32Array(splatCount);
            const idx = new Uint32Array(splatCount);
            for (let i = 0; i < splatCount; i++) {
                const dx = positions[i*3]-eyeX, dy = positions[i*3+1]-eyeY, dz = positions[i*3+2]-eyeZ;
                depths[i] = dx*dx+dy*dy+dz*dz;
                idx[i] = i;
            }
            // Radix sort
            const n = splatCount;
            const buf = new Uint32Array(n);
            const f32 = depths;
            const u32 = new Uint32Array(f32.buffer);
            for (let byte = 0; byte < 4; byte++) {
                const counts = new Uint32Array(256);
                const shift = byte * 8;
                for (let i = 0; i < n; i++) counts[(u32[i] >> shift) & 0xFF]++;
                let sum = 0;
                for (let i = 0; i < 256; i++) { const c = counts[i]; counts[i] = sum; sum += c; }
                for (let i = 0; i < n; i++) {
                    const b = (u32[i] >> shift) & 0xFF;
                    buf[counts[b]] = idx[i];
                    counts[b]++;
                }
                idx.set(buf);
            }
            // Back to front
            for (let i = 0; i < n; i++) {
                const s = idx[n - 1 - i];
                sortedPos[i*3] = positions[s*3]; sortedPos[i*3+1] = positions[s*3+1]; sortedPos[i*3+2] = positions[s*3+2];
                sortedCol[i*4] = colors[s*4]; sortedCol[i*4+1] = colors[s*4+1]; sortedCol[i*4+2] = colors[s*4+2]; sortedCol[i*4+3] = colors[s*4+3];
                sortedCovA[i*3] = covAs[s*3]; sortedCovA[i*3+1] = covAs[s*3+1]; sortedCovA[i*3+2] = covAs[s*3+2];
                sortedCovB[i*3] = covBs[s*3]; sortedCovB[i*3+1] = covBs[s*3+1]; sortedCovB[i*3+2] = covBs[s*3+2];
            }
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, sortedPos);
            gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, sortedCol);
            gl.bindBuffer(gl.ARRAY_BUFFER, covABuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, sortedCovA);
            gl.bindBuffer(gl.ARRAY_BUFFER, covBBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, sortedCovB);
        }

        // Load .splat file
        fetch('./models/sophist_point_cloud.splat')
            .then(r => {
                status.textContent = 'Parsing ' + (r.headers.get('content-length')/1e6).toFixed(1) + ' MB...';
                return r.arrayBuffer();
            })
            .then(buf => {
                const f = new Float32Array(buf);
                const u = new Uint8Array(buf);
                const n = Math.floor(buf.byteLength / 32);
                status.textContent = `Loaded ${n} splats, building...`;

                splatCount = n;
                positions = new Float32Array(n * 3);
                colors = new Float32Array(n * 4);
                covAs = new Float32Array(n * 3);
                covBs = new Float32Array(n * 3);
                sortedPos = new Float32Array(n * 3);
                sortedCol = new Float32Array(n * 4);
                sortedCovA = new Float32Array(n * 3);
                sortedCovB = new Float32Array(n * 3);

                // First pass: compute center
                let cx=0, cy=0, cz=0;
                for (let i = 0; i < n; i++) {
                    cx += f[i*8+0]; cy += f[i*8+1]; cz += f[i*8+2];
                }
                cx /= n; cy /= n; cz /= n;
                status.textContent = `Center: (${cx.toFixed(2)}, ${cy.toFixed(2)}, ${cz.toFixed(2)})`;
                camTarget = [cx, cy, cz];

                for (let i = 0; i < n; i++) {
                    const px = f[i*8+0], py = f[i*8+1], pz = f[i*8+2];
                    const sx = f[i*8+3], sy = f[i*8+4], sz = f[i*8+5];
                    positions[i*3] = px; positions[i*3+1] = py; positions[i*3+2] = pz;

                    colors[i*4]   = u[i*32+24] / 255;
                    colors[i*4+1] = u[i*32+25] / 255;
                    colors[i*4+2] = u[i*32+26] / 255;
                    colors[i*4+3] = u[i*32+27] / 255;

                    // Quaternion
                    const qw = (u[i*32+28] - 128) / 128;
                    const qx = (u[i*32+29] - 128) / 128;
                    const qy = (u[i*32+30] - 128) / 128;
                    const qz = (u[i*32+31] - 128) / 128;
                    const ql = Math.sqrt(qw*qw+qx*qx+qy*qy+qz*qz) || 1;
                    const w=qw/ql, x=qx/ql, y=qy/ql, z=qz/ql;

                    // Rotation matrix from quaternion
                    const R00=1-2*(y*y+z*z), R01=2*(x*y-w*z), R02=2*(x*z+w*y);
                    const R10=2*(x*y+w*z), R11=1-2*(x*x+z*z), R12=2*(y*z-w*x);
                    const R20=2*(x*z-w*y), R21=2*(y*z+w*x), R22=1-2*(x*x+y*y);

                    // M = R * S
                    const m00=R00*sx, m01=R01*sy, m02=R02*sz;
                    const m10=R10*sx, m11=R11*sy, m12=R12*sz;
                    const m20=R20*sx, m21=R21*sy, m22=R22*sz;

                    // Covariance = M * M^T (upper triangle as 6 values → stored as 2x vec3)
                    covAs[i*3]   = m00*m00 + m01*m01 + m02*m02;
                    covAs[i*3+1] = m00*m10 + m01*m11 + m02*m12;
                    covAs[i*3+2] = m00*m20 + m01*m21 + m02*m22;
                    covBs[i*3]   = m10*m10 + m11*m11 + m12*m12;
                    covBs[i*3+1] = m10*m20 + m11*m21 + m12*m22;
                    covBs[i*3+2] = m20*m20 + m21*m21 + m22*m22;
                }

                // Create GPU buffers
                posBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, sortedPos, gl.DYNAMIC_DRAW);
                colBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferData(gl.ARRAY_BUFFER, sortedCol, gl.DYNAMIC_DRAW);
                covABuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, covABuf); gl.bufferData(gl.ARRAY_BUFFER, sortedCovA, gl.DYNAMIC_DRAW);
                covBBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, covBBuf); gl.bufferData(gl.ARRAY_BUFFER, sortedCovB, gl.DYNAMIC_DRAW);

                status.textContent = `${n} splats ready`;
                setTimeout(() => status.style.display = 'none', 2000);
                requestAnimationFrame(render);
            })
            .catch(err => {
                status.textContent = 'Error: ' + err.message;
                console.error(err);
            });

        let lastSortTheta = null, lastSortPhi = null, frameN = 0;

        function render() {
            requestAnimationFrame(render);
            frameN++;

            const eye = [
                camDist * Math.cos(camPhi) * Math.sin(camTheta) + camTarget[0],
                camDist * Math.sin(camPhi) + camTarget[1],
                camDist * Math.cos(camPhi) * Math.cos(camTheta) + camTarget[2]
            ];

            // Re-sort periodically or when camera moves significantly
            if (lastSortTheta === null || frameN % 4 === 0) {
                sortSplats(eye[0], eye[1], eye[2]);
                lastSortTheta = camTheta;
                lastSortPhi = camPhi;
            }

            const aspect = canvas.width / canvas.height;
            const projMat = perspective(0.9, aspect, 0.1, 100);
            const viewMat = lookAt(eye, camTarget, [0, 1, 0]);

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.95, 0.95, 0.95, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.useProgram(prog);
            gl.uniformMatrix4fv(u_proj, false, projMat);
            gl.uniformMatrix4fv(u_view, false, viewMat);
            gl.uniform2f(u_viewport, canvas.width, canvas.height);

            // Bind attributes as instanced
            const a_pos = gl.getAttribLocation(prog, 'pos');
            const a_col = gl.getAttribLocation(prog, 'col');
            const a_covA = gl.getAttribLocation(prog, 'covA');
            const a_covB = gl.getAttribLocation(prog, 'covB');

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.enableVertexAttribArray(a_pos);
            gl.vertexAttribPointer(a_pos, 3, gl.FLOAT, false, 0, 0);
            gl.vertexAttribDivisor(a_pos, 1);

            gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
            gl.enableVertexAttribArray(a_col);
            gl.vertexAttribPointer(a_col, 4, gl.FLOAT, false, 0, 0);
            gl.vertexAttribDivisor(a_col, 1);

            gl.bindBuffer(gl.ARRAY_BUFFER, covABuf);
            gl.enableVertexAttribArray(a_covA);
            gl.vertexAttribPointer(a_covA, 3, gl.FLOAT, false, 0, 0);
            gl.vertexAttribDivisor(a_covA, 1);

            gl.bindBuffer(gl.ARRAY_BUFFER, covBBuf);
            gl.enableVertexAttribArray(a_covB);
            gl.vertexAttribPointer(a_covB, 3, gl.FLOAT, false, 0, 0);
            gl.vertexAttribDivisor(a_covB, 1);

            gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, splatCount);
        }
    </script>
</body>
</html>
