<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sculpture Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-family: monospace;
            font-size: 16px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loader">Loading sculpture...</div>
    <div id="info">Orbit: drag &nbsp;|&nbsp; Zoom: scroll &nbsp;|&nbsp; Pan: right-drag</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            cameraUp: [0, 1, 0],
            initialCameraPosition: [0, 1, 4],
            initialCameraLookAt: [0, 0.5, 0],
            selfDrivenMode: true,
            useBuiltInControls: true,
            dynamicScene: false,
            baseRendererType: GaussianSplats3D.BaseRendererType.ThreeJS,
            sharedMemoryForWorkers: false
        });

        viewer.addSplatScene('./models/sculpture.ply', {
            showLoadingUI: false,
            progressiveLoad: true
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            console.log('Sculpture loaded');
        })
        .catch(err => {
            document.getElementById('loader').textContent = 'Error: ' + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
